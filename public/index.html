<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Android & Mobile Viewport / PWA meta tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F4A22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StudyMate Classroom</title>
  <link rel="manifest" href="manifest.json">

  <!-- Botanical Watercolor Design Tokens & Google Fonts: Cardo & Zilla Slab -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-forest: #0F4A22;
      --sage-blob: #A9BC9B;
      --mint-wash: #C5DCC6;
      --teal-wash: #9CBFA7;
      --cream-paper: #FAF6EE;
      --accent-peach: #E8A598;
      --charcoal-slate: #1A3022;
    }
    body {
      background: radial-gradient(ellipse at 50% 30%, #F5F9F4 0%, #E7EFE5 55%, #D6E4D3 100%);
      margin: 0;
      font-family: 'Zilla Slab', Georgia, serif;
      overflow-x: hidden;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FAF6EE; z-index: 99999; font-family: 'Cardo', Georgia, serif; transition: opacity 0.4s ease;">
    <div style="width: 48px; height: 48px; border: 3px solid #C5DCC6; border-top: 3px solid #0F4A22; border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
    <div style="font-size: 22px; font-weight: bold; color: #0F4A22; margin-top: 18px; letter-spacing: 0.5px;">StudyMate Classroom</div>
    <div style="font-size: 13.5px; color: #355843; font-family: 'Zilla Slab', Georgia, serif; margin-top: 6px;">Opening your botanical study workspace...</div>
  </div>
  <script>
    // Force unregister stale service worker to ensure fresh app bundles load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    function removeLoader() {
      var loader = document.getElementById('loading');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    setTimeout(removeLoader, 4500);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=phone_v2" async></script>
</body>
</html>
